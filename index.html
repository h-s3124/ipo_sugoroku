</script>
<title>価値創造ストーリーSVCOすごろく</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 盤面（印刷版と同じ見た目）を左に縮小表示し、右に進行パネル。1台のPCを囲んで遊ぶ前提 */
:root{
  --paper:#F7F3EA; --card:#FFFDF8; --ink:#1B2433; --muted:#5C574C; --line:#D9CFB8;
  --navy:#00325D; --gold:#887755; --stop:#A0521D; --bad:#9E2A1F; --good:#3F6B42;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px}
.g-app{display:flex;gap:16px;align-items:flex-start;padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
.g-boardwrap{flex:1 1 640px;min-width:0;position:relative;overflow:hidden;border-radius:14px;box-shadow:0 1px 0 var(--line), 0 10px 30px rgba(0,50,93,.10);background:var(--paper)}
.g-board{position:absolute;left:0;top:0;width:2246px;height:1587px;transform-origin:0 0}
.g-side{flex:0 0 340px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width: 980px){ .g-app{flex-direction:column} .g-side{flex-basis:auto;width:100%} .g-boardwrap{width:100%;flex-basis:auto} }

.g-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.g-turn{display:flex;align-items:center;gap:12px}
.g-turn .who{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.2;text-wrap:balance}
.g-turn .sub{font-size:12px;color:var(--muted)}
.g-dice{width:64px;height:64px;flex:none;border-radius:14px;border:2px solid var(--navy);display:grid;place-items:center;font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--navy);background:#FFFFFF}
.g-dice.rolling{animation:shake .4s linear infinite}
@keyframes shake{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}100%{transform:rotate(-6deg)}}
@media (prefers-reduced-motion: reduce){ .g-dice.rolling{animation:none} .g-token{transition:none!important} }
.g-btn{appearance:none;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:900;font-size:15px;cursor:pointer;background:var(--navy);color:#FFFFFF;letter-spacing:.04em}
.g-btn:hover{filter:brightness(1.12)}
.g-btn:focus-visible,.g-opt:focus-visible{outline:3px solid #E2C98A;outline-offset:2px}
.g-btn:disabled{background:#B9B3A4;cursor:not-allowed;filter:none}
.g-btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy);padding:8px 12px;font-size:13px}
.g-movelbl{margin-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
.g-move{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.g-move .g-btn{padding:12px 0;font-size:20px;font-family:var(--f-display)}
.g-move .g-auto{grid-column:1 / -1;font-size:12px;padding:6px 0;font-family:var(--f-body)}
.g-btn:disabled{opacity:.4;cursor:not-allowed}
.g-movenote{font-size:12px;color:var(--stop);font-weight:700;margin-top:6px;min-height:1em}
.g-opts.dice{display:grid;grid-template-columns:repeat(6,1fr)}
.g-opts.dice .g-opt{text-align:center;font-size:22px;font-weight:800;font-family:var(--f-display);padding:14px 0}
.g-opts.dice .g-opt:last-child{grid-column:1 / -1;font-size:13px;font-weight:500;font-family:var(--f-body);padding:8px}
.g-h{font-family:var(--f-display);font-size:16px;font-weight:800;color:var(--navy);margin:0 0 8px}
.g-players{display:flex;flex-direction:column;gap:8px}
.g-p{display:grid;grid-template-columns:14px 1fr auto;gap:4px 10px;align-items:start;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#FFFFFF}
.g-p.now{border:2px solid var(--navy);background:#EEF2F7}
.g-p.done{opacity:.6}
.g-dot{width:14px;height:14px;border-radius:50%;margin-top:3px;box-shadow:0 0 0 2px #FFFFFF, 0 0 0 3px rgba(0,0,0,.25)}
.g-p .nm{font-weight:900}
.g-p .meta{grid-column:2 / 4;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 10px}
.g-p .pts{font-family:var(--f-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.g-chips{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:4px}
.g-chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#E7E1EF;color:#3E2F63}
.g-chip.spot{background:#FFFFFF;color:#3E2F63;border:1px dashed #5E4A86}
.g-chip.type{background:var(--navy);color:#FFFFFF}
.g-chip.rest{background:#F5DCD7;color:var(--bad)}
.g-market{display:flex;flex-wrap:wrap;gap:6px}
.g-log{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.5}
.g-log div{padding:6px 8px;border-radius:8px;background:#FFFFFF;border:1px solid var(--line)}
.g-log .bad{border-color:#E8B9B2;background:#FCF1EF}
.g-log .good{border-color:#C9DEC9;background:#F1F7F1}
.g-foot{display:flex;gap:8px;flex-wrap:wrap}

.g-token{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:4px solid #FFFFFF;box-shadow:0 4px 10px rgba(0,0,0,.35);display:grid;place-items:center;color:#FFFFFF;font-weight:900;font-size:18px;transition:left .25s ease, top .25s ease;z-index:50;pointer-events:none}
.g-token.now{width:58px;height:58px;margin:-29px 0 0 -29px;font-size:22px;z-index:60;outline:4px solid #E2C98A}

.g-overlay{position:fixed;inset:0;background:rgba(17,28,44,.55);display:grid;place-items:center;z-index:100;padding:16px}
.g-overlay[hidden]{display:none}
.g-modal{background:var(--card);border-radius:16px;max-width:520px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:calc(100% - 32px);overflow:auto}
.g-modal .kicker{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--stop)}
.g-modal h2{font-family:var(--f-display);font-size:24px;font-weight:800;color:var(--navy);margin:4px 0 10px;text-wrap:balance}
.g-modal p{margin:0 0 10px;line-height:1.65}
.g-modal .eff{font-weight:900}
.g-point{background:#F3EEE2;border-left:0;border-radius:10px;padding:10px 12px;margin:4px 0 10px;line-height:1.65;font-size:13.5px}
.g-point b{display:block;font-size:12px;letter-spacing:.08em;color:var(--gold);margin-bottom:2px}
.g-opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.g-opt{appearance:none;text-align:left;font:inherit;font-size:15px;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:#FFFFFF;cursor:pointer;color:var(--ink)}
.g-opt small{display:block;margin-top:4px}
.sn-role{display:block;font-size:13px;color:var(--ink);line-height:1.5}
.sn-kind{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sn-row{display:flex;gap:4px;margin:6px 0 4px;flex-wrap:wrap}
.sn-c{font-size:11px;padding:2px 6px;border-radius:6px;background:#EEF2F7;color:var(--navy);font-weight:700}
.sn-c b{margin-left:3px;font-variant-numeric:tabular-nums}
.sn-c.now{background:var(--navy);color:#FFFFFF}
.sn-c.past{background:#F1F1F1;color:#A0A0A0;text-decoration:line-through}
.sn-c.zero:not(.past){opacity:.45}
.sn-ahead{display:block;font-size:12px;line-height:1.5;color:var(--ink)}
.sn-ahead.none{color:var(--muted)}
.g-p .cash{font-family:var(--f-display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
.g-prods{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:4px}
.g-prod{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#FBF3DC;color:#6A5420;border:1px solid #E6D3A0}
.g-prod.flip{background:#F3F0EA;color:#8A8270;border-style:dashed;text-decoration:line-through}
.g-prod.flip span{text-decoration:none}
.g-shop{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.g-na{font-size:12.5px;color:var(--muted);padding:8px 12px;border:1px dashed var(--line);border-radius:10px}
.g-money{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-variant-numeric:tabular-nums;font-size:13.5px;margin:6px 0 10px}
.g-money b{text-align:right}
.b3 .sq{cursor:pointer}
.b3 .sq:hover polygon,.b3 .sq:focus polygon,.b3 .sq:hover circle{stroke:#E2A33A;stroke-width:6;stroke-opacity:1}
.b3 .sq:focus{outline:none}
.g-sqinfo{position:fixed;right:max(16px, env(safe-area-inset-right, 0px));bottom:16px;width:min(380px, calc(100vw - 32px));max-height:min(70vh, 640px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.28);padding:16px 18px 12px;z-index:90}
.g-sqinfo[hidden]{display:none}
.g-sqinfo .kicker{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--stop)}
.g-sqinfo h2{font-family:var(--f-display);font-size:21px;font-weight:800;color:var(--navy);margin:4px 28px 8px 0}
.g-sqinfo p{margin:0 0 8px;line-height:1.6}
.g-sqinfo .g-money{font-size:12.5px}
.g-sqinfo .g-money b{white-space:nowrap}
.sqi-x{position:absolute;top:8px;right:10px;appearance:none;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:6px}
.g-main{flex:1 1 640px;min-width:0;display:flex;flex-direction:column;gap:12px}
.g-main .g-boardwrap{flex:none;width:100%}
.h-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.h-card{border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:12px;padding:10px 12px;background:#FFFFFF;display:flex;flex-direction:column;gap:6px}
.h-card header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h-card header b{font-size:15px}
.h-val{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.h-row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.h-lbl{font-size:11px;font-weight:900;color:var(--muted);min-width:72px}
.h-none{font-size:12px;color:#A39C8C}
.h-item{appearance:none;font:inherit;font-size:12px;font-weight:700;text-align:left;border-radius:8px;padding:4px 8px;border:1px solid var(--line);background:#FBF8F1;color:var(--ink);cursor:pointer;line-height:1.35}
.h-item small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.h-item:hover,.h-item:focus-visible{border-color:var(--navy);outline:none}
.h-item.prod{background:#E7EEF6;border-color:#B8C9DD;color:#00325D}
.h-item.inv{background:#FBF3DC;border-color:#E6D3A0}
.h-item.inv.flip{background:#F3F0EA;border-style:dashed}
.h-item.sup{background:#E7E1EF;border-color:#C9BEDB}
.h-item.sup.spot{background:#FFFFFF;border-style:dashed}
.h-item.type{background:var(--navy);color:#FFFFFF;border-color:var(--navy);font-size:11px;padding:2px 8px}
.h-item.acc{background:#FCF1EF;border-color:#E8B9B2}
.h-item.acc.ok{background:#F1F7F1;border-color:#C9DEC9}
.h-tag{font-size:10px;font-weight:900;color:#8A6A1F;margin-right:4px}
.h-no{display:inline-block;min-width:30px;font-size:11px;color:var(--muted);font-weight:900}
.g-opts.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.g-opts.cards .g-opt{font-size:13.5px;padding:9px 11px}
.g-opts.cards .g-opt.sub{grid-column:1 / -1;text-align:center;font-size:13px;padding:8px}
.g-sync{font-size:12.5px;line-height:1.5;border-radius:10px;padding:8px 12px;background:#EEF2F7;color:var(--navy)}
.g-sync.local{background:transparent;color:var(--muted);padding:0 4px}
.g-sync:empty{display:none}
.g-link{appearance:none;border:0;background:none;color:var(--bad);text-decoration:underline;font:inherit;font-weight:700;cursor:pointer;padding:0}
.g-check{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0 6px}
.g-modal{max-width:640px}
.g-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.g-tabs .g-btn{font-size:13px;padding:9px 12px}
.g-code{font-size:18px;letter-spacing:.2em;background:#FFFFFF;border-radius:6px;padding:0 6px}
.g-opt:hover{border-color:var(--navy)}
.g-opt.ok{border-color:var(--good);background:#EAF3EA}
.g-opt.ng{border-color:var(--bad);background:#FBE9E6}
.g-opt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.g-back{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:flex-start}
.g-back .g-btn{font-size:13px;padding:8px 12px}

.g-setup h2{font-size:28px}
.g-row{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center}
.g-row input{font:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;width:100%;box-sizing:border-box;background:#FFFFFF;color:var(--ink)}
.g-row input:focus{outline:none;border-color:var(--navy)}
.g-count{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.g-count button{min-width:44px}
.g-count button[aria-pressed="true"]{background:var(--navy);color:#FFFFFF}
.g-results{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:8px}
.g-results th,.g-results td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}
.g-results th:first-child,.g-results td:first-child,.g-results th:nth-child(2),.g-results td:nth-child(2){text-align:left}
.g-results tr.win td{font-weight:900;background:#FBF3DC}

/* ===== 盤面（印刷版から） ===== */
.b3{display:block}

const STORY={"1": ["仲間と株式会社を立ち上げた。定款を作り、法務局で設立登記をすませた。", "設立登記は司法書士に頼むのが一般的。誰が何%の株を持つかという資本政策は、この時点から始まっている。"], "2": ["インキュベーション施設のシェアオフィスに入居。隣の席は先輩起業家だ。", "支援施設では、メンターや専門家、投資家とつながる機会が多い。"], "3": ["最初のプロトタイプを作って、お客さん候補に試してもらった。", "思い込みで作り込まず、小さく作って顧客の反応を確かめるのが失敗を減らす近道。"], "5": ["会社名義の銀行口座を開設した。取引先への請求も会社の口座で受け取れる。", "法人口座は取引や融資の前提。社長個人のお金と会社のお金を分けるのが、上場準備の第一歩でもある。"], "6": ["日本政策金融公庫の創業融資が下りた。株を渡さずに運転資金を確保できた。", "融資（デットファイナンス）は返済が必要な代わりに株式を手放さない。出資（エクイティ）との使い分けが大事。"], "7": ["サービス名を商標登録し、コア技術の特許も出願した。", "後から類似商標や権利侵害が見つかると、名前や製品の変更に大きなコストがかかる。"], "8": ["創業補助金に採択された。設備投資に使える。", "補助金は返済不要だが、原則は後払いで使い道にも制限がある。資金繰りの計画に注意。"], "10": ["ピッチコンテストで優勝！ 審査員の投資家から声がかかった。", "ピッチは資金だけでなく、支援者や専門家とつながるきっかけになる。"], "11": ["エンジェル投資家から最初の出資を受けた。", "出資を受けると株式を渡すので、創業者の持株比率は下がる（希薄化）。誰にどれだけ渡すかは慎重に。"], "16": ["最初のお客さんはついた。でも、本当に市場に求められているのか。創業チームにとって最初の正念場。", "PMF（プロダクト・マーケット・フィット）とは、製品が市場にしっかり受け入れられた状態のこと。"], "17": ["解約したお客さんにもう一度話を聞きに行った。", "うまくいかない理由は、顧客の声の中にあることが多い。"], "19": ["ターゲットを変えて、事業モデルを組み直した（ピボット）。", "ピボットは失敗ではなく方向転換。早く決めるほど資金の消耗が少ない。"], "20": ["経営者として必要な財務・ガバナンスの考え方を体系的に学べる講座がある。", "SVCO育成講座は、企業価値を高めるための財務と経営の定石を学ぶ講座。早いうちに学んでおくと、上場準備で指摘を受けにくくなる。"], "21": ["毎月出ていくお金に対して、手元資金が心細くなってきた。", "あと何か月資金がもつか（ランウェイ）を常に把握しておくのが経営の基本。"], "22": ["第二創業メンバーが参画！ 事業を一緒に伸ばしてくれる。", "仲間を集めるときは、株やストックオプションの配り方も上場をにらんで設計する。"], "A1": ["リピートが増え、口コミでお客さんが来るようになった。PMF達成！", "PMFを達成してから、本格的に人やお金を投じるのがセオリー。"], "A2": ["初めての大口のお客さんと契約できた。", "最初の顧客の声は、プロダクトを磨く一番の材料になる。"], "A4": ["代理店や紹介経由の販売ルートができた。", "売上を継続して伸ばす仕組みがあるかどうかは、投資家も上場審査も注目する。"], "23": ["ベンチャーキャピタル（VC）からシードラウンドの資金を調達した。", "VCとは投資契約や株主間契約を結ぶ。将来の上場（エグジット）が前提のお金だ。"], "24": ["初めて正社員を何人か採用した。就業規則も整えた。", "上場審査では労務管理が厳しく見られる。未払い残業などは後から大きな問題になる。社労士の出番。"], "28": ["シリーズAの資金調達。事業が伸びることを示して、VCから大きなお金を集める。", "シリーズAは、PMFを達成して事業を広げる段階の資金調達。ここで集めたお金で人や販売に投資する。"], "29": ["売上が伸びて、社員も増えてきた。一気に事業を広げるか、まずは管理の足元を固めるか。", "成長と管理体制のバランスは、上場を目指す会社の永遠のテーマ。"], "30": ["経理を強化し、月次決算を早く正確に締められるようになった。CFOが加わった。", "上場すると決算を素早く開示する必要がある。準備段階から月次決算の早期化が求められる。"], "31": ["システムのアクセス権限や変更管理のルールを整えた。", "J-SOX（内部統制報告制度）では、ITの統制も評価の対象になる。"], "33": ["災害やシステム障害が起きたときの対応手順（BCP）を作った。", "事業が止まらない仕組みづくりは、顧客や投資家の信頼につながる。"], "35": ["新しい事業のために子会社を作った。", "子会社ができると連結決算が必要になる。グループ全体の管理体制が問われる。"], "B1": ["新しい地域や事業に一気に打って出た。", "拡大は大きなリターンを生むが、管理が追いつかないとトラブルの種になる。"], "B3": ["新サービスがヒットした！", "複数の柱があると、ひとつの事業に頼るリスクが下がる。"], "36": ["次の資金調達ラウンドもまとまった。上場が現実的な目標になってきた。", "このあたりから、上場時期を見据えた本格的な準備（N-3期、N-2期…）が始まる。"], "37": ["上場に向けて、経営を任せられるマネジメント層が必要になった。", "上場会社には、社長ひとりに頼らない経営体制が求められる。"], "38": ["取引先との契約書のひな形を整え、法務チェックの流れを作った。", "口約束や古い契約は、審査やデューデリジェンスで問題になりやすい。"], "39": ["監査を担当してもらう監査法人が決まった（このマスは通過しても監査法人がつく）。", "上場申請には、直前2期分の財務諸表について監査法人の監査を受ける必要がある。"], "41": ["取締役会や社内規程、承認ルールを整えた。", "内部統制とガバナンスは、上場会社として信頼されるための土台。"], "42": ["上場を引き受けてくれる主幹事証券会社が決まった（このマスは通過しても主幹事証券がつく）。", "主幹事証券は上場準備を指導し、引受審査も行う。上場の伴走者だ。"], "49": ["N-1期が終わり、いよいよ上場申請。申請書類や開示を回せる管理体制は整っている？", "上場申請の中心になるのはCFOと管理部門。体制が弱いと、申請書類の作成や審査対応に時間がかかる。"], "50": ["管理体制を立て直すため、力を貸してくれる専門家を探した。", "上場準備は社内だけでは回らない。足りない分野を専門家で補うのが近道。"], "51": ["取引先や株主、役員に反社会的勢力がいないかを調べた。役員との取引も見直した。", "反社会的勢力との関係がないことや、関連当事者との取引が妥当かどうかは、上場審査で必ず確認される。"], "53": ["東証のどの市場に上場するかを決めた。", "東証にはプライム・スタンダード・グロースの3つの市場がある。成長企業はグロース市場から上場することが多い。"], "54": ["開示資料の作り方を一から見直すことになった。", "上場後は、決算や重要な出来事をタイミングよく正しく開示する体制が欠かせない。"], "C1": ["上場申請書類（Ⅰの部・Ⅱの部）を作り上げた。", "会社の事業やリスク、管理体制を細かく説明する分厚い書類。準備には何か月もかかる。"], "C2": ["上場時に新しく発行する株と、既存株主が売り出す株の数が決まった。", "公募と売出しの組み合わせ（オファリング）は、資金調達額と株主構成を左右する。"], "C3": ["上場後の開示に備えて、決算発表の手順をリハーサルした。", "上場会社は決算や重要な出来事を、決められた期限までに正しく開示しなければならない。"], "C4": ["投資家に向けて、会社の成長の筋道（エクイティストーリー）を固めた。", "なぜ成長できるのかを一貫して語れることが、株価にも影響する。"], "56": ["取引所の審査が始まった。ヒアリングで次々と質問が飛んでくる。ここを越えれば、ついに上場！", "取引所の審査に通ると上場承認。そこから約1か月で上場日を迎える。"], "57": ["機関投資家を回って会社を説明するロードショー。需要を見て公開価格が決まる。", "仮条件を決めて投資家の需要を集め（ブックビルディング）、公開価格を決める。"], "58": ["上場の日。取引所で鐘を鳴らした！ グロース市場に上場だ。", "上場はゴールではなくスタート。ここからは株主に対して成長を示し続ける責任がある。"], "60": ["上場後、売上が年100億円を超えた。", "売上100億円は成長企業のひとつの目安。規模が大きくなると機関投資家の投資対象にも入りやすい。"], "61": ["決算で、のれんや設備の価値が下がっていないか確かめる「減損テスト」を行った。", "IFRSでは、のれんを毎年償却しない代わりに、毎年減損テストを行う。業績が計画を下回ると、一度に大きな損失が出ることがある。"], "63": ["ライバル企業を買収するチャンスが来た。", "M&Aでは、買う前の調査（デューデリジェンス）と、買った後の統合（PMI）が成否を分ける。"], "64": ["海外展開を進め、社外取締役を増やしてガバナンスを強化した。", "上場会社には、コーポレートガバナンス・コードに沿った体制づくりが求められる。"], "66": ["機関投資家との個別ミーティングを重ね、英文の開示も始めた。", "プライム市場の会社には、投資家との対話や英文開示の充実が求められる。"], "55": ["管理体制を立て直すため、力を貸してくれる専門家を探した。", "上場準備は社内だけでは回らない。足りない分野を専門家で補うのが近道。"], "12": ["最初のお客さんからお金をいただいた。小さな金額だけど、事業になった瞬間だ。", "売上が立つと、事業が本当に求められているかを数字で確かめられるようになる。"], "14": ["いくらで売るか決めなければならない。安くすれば広がりやすいが、利益は薄い。", "値付けは利益と成長を左右する大事な経営判断。安売りは後から値上げしにくい。"], "15": ["アクセラレーター（起業支援プログラム）に採択された。先輩起業家や専門家とつながれる。", "アクセラレーターは助言やネットワークを提供し、短期間で事業を磨く手助けをする。"], "26": ["人を増やすタイミングが来た。一気に採用するか、少人数で回すか。", "採用は固定費を増やす。売上の見通しと資金繰りに合わせて計画することが大事。"], "34": ["予算を立てて、毎月の実績と比べる仕組みを入れた。", "予算と実績の管理（予実管理）は上場審査の重要なチェックポイント。CFOがいると精度が上がる。"], "44": ["監査法人から、過去の決算の処理に問題があると指摘された。", "上場申請には直前2期の監査が必要。過去の誤りは早めに直すほど傷が小さい。"], "45": ["上場準備として労務の調査を受けた。残業代の計算が正しいかが問われる。", "未払い残業代は上場審査で必ず確認される。社労士と早めに整えておくのが定石。"], "46": ["海外の投資家にも買ってもらうため、会計基準をIFRS（国際財務報告基準）に切り替えるか検討した。", "IFRSにすると海外投資家と比べやすくなり、グローバルオファリング（海外での株の募集）もしやすい。ただし移行には費用がかかり、のれんを償却しないぶん減損の影響が大きく出やすい。"], "25": ["売上が年10億円を超えた。事業がしっかり大きくなってきた。", "売上の規模は企業価値の評価に直結する。同じ利益率でも、規模が大きいほど評価されやすい。"], "48": ["上場後の株主構成をにらんで、資本政策を見直した。", "誰がどれだけ株を持つかは、上場後の経営の安定に直結する。"], "62": ["上場して初めての決算説明会。投資家に業績と今後の成長を説明した。", "上場会社は投資家への説明責任がある。伝わり方ひとつで株価が動く。"]};
const QUIZ = {"17": [{"q": "PMF（プロダクトマーケットフィット）とはどんな状態？", "choices": ["プロダクトが市場のニーズに合い、お客さんに求められ続けている状態", "製品の製造コストを最小にできた状態", "市場シェアで1位になった状態", "特許を取って他社がまねできなくなった状態"], "correct": 0, "note": "PMFは「作ったものが本当に求められているか」。売れ続ける・使われ続けることで確かめる。"}, {"q": "PMFできているかを確かめる数字として、いちばんふさわしいのは？", "choices": ["解約率（チャーンレート）や継続利用率", "アプリのダウンロード数（登録者数）", "問い合わせの件数", "広告のクリック率"], "correct": 0, "note": "登録や問い合わせは「興味」まで。使い続けてもらえているかを見るのが大事。"}, {"q": "お客さんの声を確かめるとき、いちばん信頼できる情報は？", "choices": ["実際にお金を払って使い続けているかどうか", "インタビューで「いいですね、使いたい」と言ってもらえたこと", "知り合いの経営者が「伸びる」と言ってくれたこと", "競合が似た製品を出してきたこと"], "correct": 0, "note": "「使いたい」という言葉と、実際にお金を払う行動は違う。行動のデータを重視する。"}, {"q": "お客さん1人を獲得するのにかかった費用を何という？", "choices": ["CAC（顧客獲得コスト）", "LTV（顧客生涯価値）", "ARR（年間経常収益）", "NPS（顧客推奨度）"], "correct": 0, "note": "CAC＝広告費や営業費 ÷ 新しく獲得したお客さんの数。"}, {"q": "1人のお客さんが、取引が続くあいだにもたらしてくれる利益の合計を何という？", "choices": ["LTV（顧客生涯価値）", "CAC（顧客獲得コスト）", "MRR（月次経常収益）", "ROE（自己資本利益率）"], "correct": 0, "note": "LTVが大きいほど、1人のお客さんにかけられる獲得費用も大きくできる。"}, {"q": "ユニットエコノミクス（お客さん1人あたりの採算）が健全とされる、よく使われる目安は？", "choices": ["LTVがCACの3倍以上", "CACがLTVの3倍以上", "LTVとCACがちょうど同じ", "CACがLTVの半分以下なら、LTVの大きさは問わない"], "correct": 0, "note": "LTV÷CAC≧3がよく使われる目安。業種によって違うので、あくまで目安。"}], "41": [{"q": "J-SOX（内部統制報告制度）で、経営者が評価して報告する対象は？", "choices": ["財務報告に関わる内部統制", "会社の業務すべての効率性", "法令を守っているかどうかだけ", "情報セキュリティの対策だけ"], "correct": 0, "note": "J-SOXは「決算書の数字が正しく作られる仕組み」が対象。"}, {"q": "不正やミスを防ぐ「職務分掌」の考え方に沿っているのは？", "choices": ["支払の申請・承認・実行を、それぞれ別の人が担う", "信頼できるベテラン1人に、入出金と記帳をまとめて任せる", "社長がすべて承認しているので、担当は分けなくてよい", "承認は後からまとめてメールで行えばよい"], "correct": 0, "note": "1人で完結できる仕組みは、不正もミスも見つけにくい。"}, {"q": "「三様監査」に含まれないのはどれ？", "choices": ["税務署の税務調査", "監査役（監査等委員会など）の監査", "監査法人（会計監査人）の監査", "内部監査"], "correct": 0, "note": "三様監査＝監査役等・監査法人・内部監査。3者が連携して会社をチェックする。"}, {"q": "内部監査の体制で、上場審査で問題になりやすいのは？", "choices": ["内部監査の担当者が経理も兼務していて、自分の仕事を自分で監査している", "内部監査の担当を社長直属にしている", "毎年、内部監査の計画を作っている", "監査の結果を社長と監査役に報告している"], "correct": 0, "note": "監査する人は、監査される業務から独立している必要がある。小さい会社では相互監査などで工夫する。"}, {"q": "新規上場会 let UNDO = null;      // いまの手番の記録 { snap, moveN, turnNo, answers:[], rands:[], replay:null }
let LASTTURN = null;  // 直前に終わった手番の記録（手番まるごと取り消し用）
const _rand = Math.random.bind(Math);
Math.random = () => {
  if (UNDO && UNDO.replay && UNDO.replay.rands.length) { const v = UNDO.replay.rands.shift(); UNDO.rands.push(v); return v; }
  const v = _rand(); if (UNDO) UNDO.rands.push(v); return v;
};
const UNDO_SIGNAL = { undo: true };
// 最後の「本当の選択」（選択肢が2つ以上のもの）の手前までの記録を返す。なければ null
function trimToChoice(ans) { let k = ans.length - 1; while (k >= 0 && ans[k][1] < 2) k--; return k < 0 ? null : ans.slice(0, k); }

function restoreSnap(snap) { const rev = S ? S.rev : 0; S = JSON.parse(snap); S.rev = rev; S.busy = false; S.actor = null; S.view = null; }
async function undoStep() {
  if (!UNDO || !modalReject) return;
  const u = UNDO; const keep = trimToChoice(u.answers);
  u.restart = keep ? { answers: keep, rands: u.rands.slice(), moveN: u.moveN } : null;
  const rj = modalReject; modalReject = null; rj(UNDO_SIGNAL);
}
function updUndo() {
  const b = $('undoTurnBtn'); if (!b || !S) return;
  const ok = !!LASTTURN && !S.busy && LASTTURN.turnNo === S.turnNo && (!online() || LASTTURN.client === CLIENT);
  b.hidden = !ok;
  if (ok) b.textContent = `↶ ${LASTTURN.name}さんの手番をやり直す`;
}
async function undoLastTurn() {
  if (!LASTTURN || S.busy) return;
  const L = LASTTURN;
  const opts = [];
  if (trimToChoice(L.answers)) opts.push({ label: '最後の選択からやり直す', note: 'サイコロの目やそれまでの選択はそのまま。最後に選んだところをもう一度選び直す', value: 'last' });
  opts.push({ label: 'サイコロの入力からやり直す', note: '手番の最初（進む前）に戻る', value: 'all' }, { label: 'キャンセル', value: false });
  const how = await modal(`<div class="kicker">確認</div><h2>${esc(L.name)}さんの手番をやり直す？</h2>`, opts);
  if (!how) return;
  restoreSnap(L.snap); LASTTURN = null;
  render(); save(); pushSoon(true);
  if (how === 'last') setTimeout(() => takeTurn(L.moveN, { answers: trimToChoice(L.answers), rands: L.rands.slice() }), 0);
}

/* ===================== モーダル ===================== */
function modal(html, options) {
  if (UNDO && UNDO.replay && UNDO.replay.answers.length) {
    const a = UNDO.replay.answers.shift(); UNDO.answers.push(a);
    return Promise.resolve(options[Math.min(a[0], options.length - 1)].value);
  }
  if (UNDO && UNDO.replay) UNDO.replay = null;
  return new Promise((resolve, reject) => {
    const canBack = !!UNDO && !S.busySetup;
    modalReject = canBack ? reject : null;
    const m = $('modal');
    m.innerHTML = html + `<div class="g-opts${options.some(o => o.dice) ? ' dice' : ''}${options.some(o => o.card) ? ' cards' : ''}">${options.map((o, i) => `<button class="g-opt${o.card ? ' card' : ''}${o.sub ? ' sub' : ''}" type="button" data-i="${i}">${o.label}${o.note ? `<small>${o.note}</small>` : ''}</button>`).join('')}</div>${canBack ? `<div class="g-back"><button type="button" class="g-btn ghost" id="backBtn">← 1つ前に戻る${trimToChoice(UNDO.answers) ? '' : '（進む前に戻る）'}</button></div>` : ''}`;
    m.dataset.kind = 'game';
    $('overlay').hidden = false;
    if (S) { const k = m.querySelector('.kicker'), h = m.querySelector('h2'); S.view = [k && k.textContent, h && h.textContent].filter(Boolean).join('：').slice(0, 80); pushSoon(); }
    const btns = m.querySelectorAll('.g-opt');
    btns.forEach(b => b.addEventListener('click', () => { $('overlay').hidden = true; if (S) S.view = null; modalReject = null; if (UNDO) UNDO.answers.push([+b.dataset.i, options.length]); resolve(options[+b.dataset.i].value); }));
    const bb = $('backBtn'); if (bb) bb.addEventListener('click', () => { $('overlay').hidden = true; undoStep(); });
    btns[0] && btns[0].focus();
  });
}
const info = (kicker, title, body, label = 'OK') => modal(`<div class="kicker">${kicker}</div><h2>${title}</h2>${body}`, [{ label, value: true }]);

/* ===================== お金 ===================== */
function earn(p, v, why) {
  if (!v) return;
  p.cash += v; log(`${esc(p.name)}：${why} +${yen(v)}（手元 ${yen(p.cash)}）`, 'good');
}
async function pay(p, v, why) {
  if (v <= 0) return;
  if (p.cash >= v) { p.cash -= v; log(`${esc(p.name)}：${why} −${yen(v)}（手元 ${yen(p.cash)}）`, 'bad'); return; }
  const short = v - p.cash;
  await info('お金が足りない', `${yen(short)}を借り入れる`, `<p>${esc(why)}で${yen(v)}が必要だが、手元は${yen(p.cash)}しかない。足りない分は金融機関から借りる（デット）。</p>
    <div class="g-point"><b>借入のルール</b>ステージが変わるたびに、借入残高の${rateOf(p)}%を利息として払う。STOPマスでいつでも返せる。ゴール時に残っている借入は企業価値から差し引く。</div>`, '借りて払う');
  p.debt += short; p.cash = 0;
  log(`${esc(p.name)}：${why} −${yen(v)}。足りない${yen(short)}を借入（借入残高 ${yen(p.debt)}）`, 'bad');
}
async function stageChanged(p, from, to) {
  const rows = [];
  let total = 0;
  p.sups.forEach(s => { const r = supRet(p, s); if (r) { rows.push([`${s}の顧問料`, r]); total += r; } });
  const interest = Math.round(p.debt * rateOf(p) / 100);
  if (interest) { rows.push([`借入の利息（残高${yen(p.debt)}×${rateOf(p)}%）`, interest]); total += interest; }
  if (!total) { log(`${esc(p.name)}は${to}ステージへ。`); return; }
  await info(`${from} → ${to}`, `${esc(p.name)}：ステージが変わった`, `<p>伴走サポーターの顧問料と借入の利息を払う。</p><div class="g-money">${rows.map(([a, b]) => `<span>${esc(a)}</span><b>${yen(b)}</b>`).join('')}<span>合計</span><b>${yen(total)}</b></div>`, '払う');
  await pay(p, total, `${to}ステージへ（顧問料・利息）`);
}

/* ===================== 移動 ===================== */
async function stepForward(p, n) {
  for (let i = 0; i < n; i++) {
    let nx;
    if (BRANCH_IN[p.pos] && p.route === 'in') nx = BRANCH_IN[p.pos];
    else nx = NEXT[p.pos];
    if (!nx) break;
    const from = stageAt(p);
    p.pos = nx; p.trail.push(nx); p.route = null;
    render(); await wait(170);
    const to = STAGE_OF(nx);
    if (to !== from && nx !== 'GOAL') await stageChanged(p, from, to);
    if (FUNDING[nx]) { if ((p.funded || []).includes(nx)) log(`${esc(p.name)}：マス${nx}は2回目なので資金調達はなし。`); else { (p.funded = p.funded || []).push(nx); await funding(p, nx); } }
    const passSup = { '39': SUP_AUD, '42': SUP_LEAD }[nx];
    if (passSup && !p.sups.includes(passSup)) { p.sups.push(passSup); log(`${esc(p.name)}：マス${nx}を通過して<b>${passSup}</b>がついた。`, 'good'); render(); }
    if (STOPS.has(nx)) { if (i < n - 1) log(`${esc(p.name)}は<b>マス${nx}</b>で止まった（強制ストップ）。`); break; }
  }
}
function stepBack(p, n) {
  for (let i = 0; i < n && p.trail.length > 1; i++) p.trail.pop();
  p.pos = p.trail[p.trail.length - 1]; render();
}
function goTo(p, node) {
  const k = p.trail.lastIndexOf(node);
  if (k >= 0) p.trail = p.trail.slice(0, k + 1); else p.trail.push(node);
  p.pos = node; render();
}
async function funding(p, node) {
  const [name, unit] = FUNDING[node];
  const r = await askDice(`資金調達（マス${node}）`, esc(name), `<p>${esc(STORY[node] ? STORY[node][0] : '')}</p><p>サイコロを振って、出目×${yen(unit)}を調達する${p.type === '営業出身' ? '（営業出身は出目+1）' : ''}${node !== '58' && p.sups.includes(SUP_VC) ? '（VCがいるので+50%）' : ''}。</p>`);
  const eff = r + (p.type === '営業出身' ? 1 : 0);
  let v = eff * unit;
  const notes = [`出目${r}${p.type === '営業出身' ? '＋1（営業出身）' : ''} × ${yen(unit)} = ${yen(v)}`];
  if (node !== '58' && p.sups.includes(SUP_VC)) { const b = Math.round(v * RULES.VC_BONUS / 100); v += b; notes.push(`VCの後押しで +${yen(b)}`); }
  if (p.fpen) { const before = v; v = Math.round(v * RULES.FUND_PENALTY); p.fpen = false; notes.push(`調達条件の悪化で×${RULES.FUND_PENALTY}（${yen(before)} → ${yen(v)}）`); }
  if (p.ifrs && !p.ifrsUsed) { const before = v; v = Math.round(v * RULES.IFRS_FUND); p.ifrsUsed = true; notes.push(`IFRS移行で海外投資家も参加 ×${RULES.IFRS_FUND}（${yen(before)} → ${yen(v)}）`); }
  if (node === '58' && p.ipoMul && p.ipoMul !== 1) { const before = v; v = Math.round(v * p.ipoMul); notes.push(`ロードショーの結果で×${p.ipoMul}（${yen(before)} → ${yen(v)}）`); }
  let fee = 0;
  if (node === '58' && p.sups.includes(SUP_LEAD)) { fee = Math.round(v * RULES.LEAD_FEE / 100); notes.push(`主幹事証券の引受手数料 −${yen(fee)}`); }
  await info(`資金調達（マス${node}）`, `出目 ${r}：${yen(v - fee)}を調達`, `<div class="g-money">${notes.map(n => `<span>${n}</span><b></b>`).join('')}</div><div class="g-point"><b>IPOのポイント</b>${esc(STORY[node] ? STORY[node][1] : '')}</div>`, '受け取る');
  p.lastFund = v - fee;
  earn(p, v - fee, `${name}で調達`);
}

/* ===================== サポーター ===================== */
async function gainSupporter(p, name, free = false) {
  if (isKeep(name) && p.sups.includes(name)) { returnSup(name); log(`${esc(p.name)}：${esc(name)}はすでに伴走している。`); return false; }
  if (!isExempt(name)) {
    const same = p.sups.map((s, i) => [s, i]).filter(([s]) => !isExempt(s) && isKeep(s) === isKeep(name));
    if (same.length >= LIMIT) {
      const label = isKeep(name) ? '伴走サポーター' : 'スポットサポーター';
      const drop = await modal(`<div class="kicker">${label}は${LIMIT}人まで</div><h2>だれかと入れ替える？</h2><p>${esc(name)}に加わってもらうには、今の${label}を1人手放す必要がある（払った報酬は戻らない）。</p>`,
        [...same.map(([s, i]) => ({ label: `${s}を手放す`, note: supNote(s, p), value: i })), { label: `${name}は断る`, value: -1 }]);
      if (drop === -1) { returnSup(name); return false; }
      returnSup(p.sups.splice(drop, 1)[0]);
    }
  }
  if (!free && supFee(p, name) > p.cash) { returnSup(name); await info('サポーター', 'お金が足りない', `<p>${esc(name)}の報酬${yen(supFee(p, name))}を手元のお金で払えないので、確保できない（報酬に借入は使えない）。</p>`); return false; }
  if (!free) await pay(p, supFee(p, name), `${name}への報酬`);
  p.sups.push(name);
  log(`${esc(p.name)}に<b>${esc(name)}</b>（${kindOf(name)}）がついた。`, 'good');
  return true;
}
function takeFromDeck(name) {
  for (const per of PERIODS) { const k = S.supDecks[per].lastIndexOf(name); if (k >= 0) { S.supDecks[per].splice(k, 1); return true; } }
  return false;
}
const feeText = (p, s) => {
  const f = supFee(p, s), r = supRet(p, s);
  return `報酬 ${f ? yen(f) : 'なし'}${r ? `＋ステージごとに顧問料${yen(r)}` : ''}${s === SUP_LEAD ? '（IPO調達額の10%）' : ''}`;
};
async function confirmSupporter(p, name, free, title) {
  const r = await modal(`<div class="kicker">${esc(title)}</div><h2>${esc(name)}</h2><p>${free ? '報酬なしで確保できる。' : feeText(p, name) + '。'}手元：<b>${yen(p.cash)}</b></p><div class="g-point" style="display:block"><b>この専門家について</b>${supNote(name, p)}</div>`,
    [...(free || supFee(p, name) <= p.cash ? [{ label: free || !supFee(p, name) ? `${name}を確保する${free ? '' : '（報酬なし）'}` : `報酬${yen(supFee(p, name))}を払って${name}を確保する`, value: 'yes' }] : [{ label: 'お金が足りないので確保できない（選び直す）', value: 'back' }]), { label: '選び直す', value: 'back' }, ...(free ? [] : [{ label: 'だれも雇わない', value: 'no' }])]);
  return r;
}
async function chooseFromMarket(p, title, free = false) {
  const per = periodOf(p); const i = PERIODS.indexOf(per);
  const names = Object.keys(SUP).filter(n => SUP[n].decks[i]);
  while (true) {
    const pick = await modal(`<div class="kicker">交流会・${per}の山</div><h2>${title}</h2><p>${per}の山から実物のカードを3枚めくって、雇いたい1枚を選んでから、その名前を押す。${free ? '報酬はかからない。' : ''}解説は押したあとに出る。手元：<b>${yen(p.cash)}</b></p>`,
      [...names.map(n => ({ label: `${esc(n)}<small>${free ? '報酬なし' : feeText(p, n)}</small>`, value: n, card: true })),
       ...(free ? [] : [{ label: 'だれも雇わない', value: '', sub: true }]), { label: 'アプリで3枚めくる', value: '*', sub: true, note: 'カードが手元にないとき' }]);
    if (pick === '') { log(`${esc(p.name)}はだれも雇わなかった。`); return; }
    if (pick === '*') { return chooseFromAppDeck(p, title, free); }
    const r = await confirmSupporter(p, pick, free, `交流会・${per}の山`);
    if (r === 'back') continue;
    if (r === 'no') { log(`${esc(p.name)}はだれも雇わなかった。`); return; }
    takeFromDeck(pick);
    await gainSupporter(p, pick, free);
    return;
  }
}
async function chooseFromAppDeck(p, title, free = false) {
  let per = periodOf(p);
  if (!S.supDecks[per].length) per = PERIODS.find(x => S.supDecks[x].length);
  if (!per) { log('サポーターの山が尽きている。'); return; }
  const deck = S.supDecks[per];
  const open = deck.splice(-Math.min(3, deck.length)).reverse();
  const pick = await modal(`<div class="kicker">交流会・${per}の山</div><h2>${title}</h2><p>${per}の山から${open.length}枚めくった。${free ? '1人を報酬なしで確保できる。' : '報酬を払って1人確保するか、見送るか（残りは山の下に戻す）。'}手元：<b>${yen(p.cash)}</b></p>${hintBox(p)}`,
    [...open.map((s, i) => ({ label: `${s}　<span style="font-weight:500;font-size:13px">${free ? '報酬なし' : feeText(p, s)}</span>`, note: supNote(s, p), value: i })), ...(free ? [] : [{ label: 'だれも雇わない', note: 'お金をプロダクトに回す', value: -1 }])]);
  if (pick === -1) { deck.unshift(...open); log(`${esc(p.name)}はだれも雇わなかった。`); return; }
  const name = open.splice(pick, 1)[0];
  deck.unshift(...open);
  await gainSupporter(p, name, free);
}

const deckIndexOf = st => ({ '起業': 0, 'アーリー': 1, 'ミドル': 2, 'レイター': 3, 'IPO': 4, 'IPO後': 4 })[st];
function supNote(s, p) {

  const mine = ACC.filter(a => a.sup === s);
  const cells = DECKS.map((d, i) => {
    const n = mine.filter(a => a.deck === d && !own.includes(a.no)).length;
    const cls = i < now ? 'past' : i === now ? 'now' : 'next';
    return `<span class="sn-c ${cls}${n ? '' : ' zero'}">${d}<b>${n}</b></span>`;
  }).join('');
  const ahead = mine.filter(a => DECKS.indexOf(a.deck) >= now && !own.includes(a.no));

  const kind = `${kindOf(s)}${isKeep(s) ? '：何度でも力を貸してくれる' : '：1回頼むと手放す'}`;
  return `<span class="sn-role">${SUP_INFO[s] || ''}</span><span class="sn-kind">${kind}${SUP[s].perk ? '／' + SUP[s].perk : ''}</span>`

/* ===================== 事業と投資 ===================== */

    [1, 2, 3, 4, 5, 6].map(n => ({ label: String(n), value: n, dice: true })).concat([{ label: 'アプリで振る', value: 0, note: 'サイコロが手元にないとき' }]));
  if (r) { S.dice = r; render(); return r; }
  return rollAnim();

async function flipType(p, type, alt, why) {
  const cand = p.inv.filter(x => x.type === type);
  if (!cand.length) { if (alt) await pay(p, alt, `${why}（${type}の投資がないので損失）`); else log(`${esc(p.name)}：${type}の投資がないので影響なし。`); return; }
  const pool = cand.filter(x => !x.flip);
  if (!pool.length) { if (alt) await pay(p, alt, `${why}（${type}の投資はすべて×なので損失）`); else log(`${esc(p.name)}：${type}の投資はすべて×なので影響なし。`); return; }
  let t = pool[0];
  if (pool.length > 1) {
    const k = await modal(`<div class="kicker">${type}の投資にダメージ</div><h2>どれに×を付ける？</h2><p>×が付いた投資の★は数えなくなる（マス19「事業モデルの見直し」で元に戻せる）。</p>`, pool.map((x, i) => ({ label: `${esc(x.name)}（★${x.mult}）`, value: i })));
    t = pool[k];
  }
  t.flip = true; log(`${esc(p.name)}：${type}「${esc(t.name)}」に×（★${t.mult}を数えない → ★合計${starSum(p)}）`, 'bad');
}

  opts.push({ label: opts.length ? 'そのまま受ける' : '受ける', value: 'take' });

  if (r === 'use') {

    hist.result = `${a.sup}が打ち消した`; hist.blocked = true;

async function askQuiz(p, key, title, lv) {

async function decideRoute(p) {

    if (p.inv.some(x => x.type === 'マーケティング')) mods.push(['マーケティング投資', 1]);
    if (p.inv.some(x => x.type === '人材')) mods.push(['人材投資', 1]);
    if (p.type === '営業出身') mods.push(['営業出身', 1]);
    const add = mods.reduce((a, m) => a + m[1], 0);
    const d = await askDice('分岐A', 'PMF判定', `<p>移動の前に、PMF判定のサイコロを1回振る。サイコロ＋補正が5以上ならPMF達成で内側の近道へ。届かなければ外側の大回り。</p><div class="g-money">${mods.length ? mods.map(m => `<span>${m[0]}</span><b>+${m[1]}</b>`).join('') : '<span>補正なし</span><b>+0</b>'}</div>`); const tot = d + add;
    p.route = tot >= 5 ? 'in' : 'out';
    await info('PMF判定', p.route === 'in' ? `出目${d}＋${add}＝${tot}：PMF達成！` : `出目${d}＋${add}＝${tot}：まだ届かない`, `<p>${p.route === 'in' ? '市場に受け入れられた。内側の近道へ進む。' : '顧客を見直しながら、外側の大回りで進む。'}</p><div class="g-point"><b>IPOのポイント</b>PMFは「作ったものが市場に求められている」状態。顧客の声を聞く仕組み（マーケティング）と、作り直せる体制（人材）が近道になる。</div>`, '進む');
    log(`分岐A：PMF判定 ${tot} → ${p.route === 'in' ? '内側の近道（PMF達成）' : '外側の大回り（ピボット）'}`);

  if (p.pos === '49') { const ok = p.sups.includes('CFO') || p.sups.includes('SVCO') || p.type === '財務・会計出身'; p.route = ok ? 'in' : 'out'; await info('分岐C　上場申請の判断', ok ? '管理体制は万全！ 内側の近道へ' : '管理体制が弱い。外側の大回りへ', `<p>${ok ? 'CFO・SVCO、または財務・会計出身の創業者が申請をリードできる。' : 'CFOがいないので、申請の前に体制を整える。'}</p>`, '進む'); log(`分岐C：${ok ? '管理体制あり → 内側の近道' : 'CFOなし → 外側の大回り'}`); }
}
async function takeTurn(moveN, replay) {
  if (S.busy) return;
  const p0 = S.players[S.cur];
  if (p0.done) { nextPlayer(); return; }
  if (!canAct()) return;
  if (!replay) S.turnNo = (S.turnNo || 0) + 1;
  UNDO = { snap: JSON.stringify(S), moveN, turnNo: S.turnNo, answers: [], rands: [], replay: replay ? { answers: replay.answers.slice(), rands: replay.rands.slice() } : null };
  LASTTURN = null;
  const p = S.players[S.cur];
  S.busy = true; S.actor = CLIENT; S.actorName = p.name; render(); pushSoon(true);
  let undone = false;
  try {
    await decideRoute(p);
    const r = moveN || await rollAnim();
    S.dice = r; render();
    log(`<b style="color:${p.color}">${esc(p.name)}</b>は<b>${r}</b>マス進む`);
    await stepForward(p, r);
    await resolve(p);
  } catch (e) {
    if (e !== UNDO_SIGNAL) throw e;
    undone = true;
  } finally {
    if (undone) {
      const u = UNDO; UNDO = null; modalReject = null;
      restoreSnap(u.snap); render(); save(); pushSoon(true);
      if (u.restart) setTimeout(() => takeTurn(u.restart.moveN, u.restart), 0);
    } else {
      S.busy = false; S.actor = null; S.view = null;
      if (UNDO) LASTTURN = { snap: UNDO.snap, turnNo: UNDO.turnNo, name: p.name, client: CLIENT, moveN: UNDO.moveN, answers: UNDO.answers.slice(), rands: UNDO.rands.slice() };
      UNDO = null; modalReject = null;
      nextPlayer();
    }
  }
}

    S.cur = (S.cur + 1) % S.players.length;
    const q = S.players[S.cur];
    if (q.done) continue;
    if (q.rest) { q.rest = false; log(`${esc(q.name)}は1回休み。`); continue; }
    break;
  }
  render(); save();
}

async function initialPicks() {

}
async function initialPickFor(p) {
  {
    const pick = await modal(`<div class="kicker">創業者タイプ</div><h2>${esc(p.name)}：どんな経歴で起業する？</h2><p>得意分野のアクシデントは、最後まで何度でも自分の経験で防げる。</p>`,

function save() { if (online()) { pushSoon(); return; } try { localStorage.setItem('ipo-sugoroku-v5', JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem('ipo-sugoroku-v5') || 'null'); return s && s.v === 5 && s.players ? s : null; } catch (e) { return null; } }


/* ===================== オンライン部屋（PeerJS / WebRTC） =====================
   1. ホストが部屋を作る（自分の名前を入れる）
   2. ほかのPCが部屋コードで入り、それぞれ自分の名前を入れる（1台で2人以上も可）
   3. ホストが「ゲーム開始」→ 各PCが自分のプレイヤーの職業・事業を自分で選ぶ
   4. 各PCは自分のプレイヤーの番だけ操作できる
   操作したPCが盤面の状態をまるごと送り、ホストが全員に配り直す。
   ============================================================================ */
const CLIENT = (() => { try { let c = sessionStorage.getItem('ipo-client'); if (!c) { c = 'c' + Math.random().toString(36).slice(2, 10); sessionStorage.setItem('ipo-client', c); } return c; } catch (e) { return 'c' + Math.random().toString(36).slice(2, 10); } })();
const NET = { mode: 'local', peer: null, host: null, guests: [], code: '', timer: null, status: '', members: [], present: [], myNames: [], setupRunning: false, retry: 0 };
const MAXP = 6;
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const makeCode = () => Array.from({ length: 4 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
const peerIdOf = code => 'ipo-sugoroku-v5-' + code.toLowerCase();
const online = () => NET.mode !== 'local';
const iAmActor = () => !!(S && S.busy && S.actor === CLIENT);
const blockedByOther = () => !!(S && S.busy && S.actor && S.actor !== CLIENT);
const mySeat = i => !online() || !!(S && S.players[i] && S.players[i].owner === CLIENT);
const canAct = () => !online() || (!!S && S.phase !== 'setup' && !blockedByOther() && mySeat(S.cur) && (NET.mode === 'host' || !!(NET.host && NET.host.open)));
const packState = () => { if (S.log.length > 80) S.log = S.log.slice(-80); return JSON.stringify(S); };
function sendAll(msg, except) { NET.guests.forEach(g => { if (g.open && g.conn !== except) { try { g.conn.send(msg); } catch (e) {} } }); }
function pushSoon(now) {
  if (!online() || !S) return;
  clearTimeout(NET.timer);
  NET.timer = setTimeout(pushNow, now ? 0 : 200);
}
function pushNow() {
  if (!online() || !S) return;
  S.rev = (S.rev || 0) + 1; S.at = Date.now();
  const msg = { t: 'state', state: packState(), rev: S.rev, from: CLIENT };
  if (NET.mode === 'host') { sendAll(msg); saveHostRoom(); }
  else if (NET.host && NET.host.open) NET.host.send(msg);
}
function applyState(msg) {
  if (iAmActor() || NET.setupRunning) return false;
  if (S && (msg.rev || 0) <= (S.rev || 0) && S.room === NET.code) return false;
  let ns; try { ns = JSON.parse(msg.state); } catch (e) { return false; }
  if (ns.room !== NET.code) return false;
  S = ns;
  if ($('modal').dataset.kind === 'setup' || $('modal').dataset.kind === 'lobby') $('overlay').hidden = true;
  render();
  setTimeout(runSetupIfMine, 0);
  return true;
}

/* ---- ロビー（ゲーム開始前） ---- */
function lobbyMembers() {
  const list = [{ client: CLIENT, names: NET.myNames, pc: 'ホスト' }];
  NET.guests.filter(g => g.open && g.names && g.names.length).forEach(g => list.push({ client: g.client, names: g.names, pc: g.pc }));
  return list;
}
function broadcastLobby() {
  NET.members = lobbyMembers();
  sendAll({ t: 'lobby', members: NET.members });
  if ($('modal').dataset.kind === 'lobby' && !$('overlay').hidden) drawLobby();
}
function broadcastPresent() {
  NET.present = [CLIENT, ...NET.guests.filter(g => g.open && g.client).map(g => g.client)];
  sendAll({ t: 'present', ids: NET.present });
  render();
}
function hostHandle(conn, msg) {
  if (!msg || typeof msg !== 'object') return;
  const g = NET.guests.find(x => x.conn === conn);
  if (msg.t === 'hello') {
    if (g) { g.client = String(msg.client || ''); g.pc = String(msg.pc || 'PC').slice(0, 12); g.names = (msg.names || []).map(n => String(n).slice(0, 12)).filter(Boolean).slice(0, MAXP); }
    if (S) {
      // 開始後の参加：観戦（または自分の担当を取り戻す）
      conn.send({ t: 'state', state: packState(), rev: S.rev || 0, from: CLIENT });
    } else {
      const total = lobbyMembers().reduce((a, m) => a + m.names.length, 0);
      if (total > MAXP) { conn.send({ t: 'full' }); if (g) g.names = []; }
    }
    broadcastLobby(); broadcastPresent(); return;
  }
  if (msg.t === 'state') {
    if (applyState(msg)) { sendAll({ t: 'state', state: packState(), rev: S.rev, from: msg.from }, conn); saveHostRoom(); }
  }
}
function guestHandle(msg) {
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'lobby') { NET.members = msg.members || []; if (!S) drawLobby(); }
  if (msg.t === 'present') { NET.present = msg.ids || []; render(); }
  if (msg.t === 'full') { NET.status = '満員のため、プレイヤーとしては参加できない（観戦はできる）'; if (!S) drawLobby(); }
  if (msg.t === 'state') { applyState(msg); renderSync(); }
  if (msg.t === 'bye') { NET.status = 'ホストが部屋を閉じた'; renderSync(); }
}
function saveHostRoom() { if (NET.mode !== 'host' || !S) return; try { localStorage.setItem('ipo-host-room', JSON.stringify({ code: NET.code, client: CLIENT, state: S })); } catch (e) {} }
function savedHostRoom() { try { const r = JSON.parse(localStorage.getItem('ipo-host-room') || 'null'); return r && r.state && r.state.finished < r.state.players.length ? r : null; } catch (e) { return null; } }
function createRoom(myNames, onReady, onFail, reuse) {
  if (typeof Peer === 'undefined') { onFail('オンライン部屋の部品を読み込めなかった（インターネット接続を確認）'); return; }
  leaveGame();
  const code = reuse ? reuse.code : makeCode();
  const peer = new Peer(peerIdOf(code));
  NET.peer = peer;
  peer.on('open', () => {
    NET.mode = 'host'; NET.code = code; NET.myNames = myNames; NET.status = '';
    if (reuse) { S = reuse.state; reuse.state.players.forEach(p => { if (p.owner === reuse.client) p.owner = CLIENT; }); }
    onReady(code); broadcastPresent(); renderSync();
  });
  peer.on('connection', conn => {
    const g = { conn, client: '', pc: 'PC', names: [], open: false }; NET.guests.push(g);
    conn.on('open', () => { g.open = true; });
    conn.on('data', m => hostHandle(conn, m));
    conn.on('close', () => { g.open = false; NET.guests = NET.guests.filter(x => x !== g); if (!S) broadcastLobby(); broadcastPresent(); renderSync(); });
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); if (reuse) onFail('前の部屋のコードがまだ使われている。1分ほど待ってから再開してください'); else createRoom(myNames, onReady, onFail); return; }
    if (NET.mode !== 'host') onFail('部屋を作れなかった：' + err.type);
    else { NET.status = '通信エラー：' + err.type; renderSync(); }
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
}
function joinRoom(code, pc, names, onOk, onFail) {
  if (typeof Peer === 'undefined') { onFail('オンライン部屋の部品を読み込めなかった（インターネット接続を確認）'); return; }
  leaveGame();
  NET.myNames = names; NET.joinInfo = { code, pc, names };
  const peer = new Peer(); NET.peer = peer;
  peer.on('open', () => {
    const conn = peer.connect(peerIdOf(code), { reliable: true });
    conn.on('open', () => { NET.mode = 'guest'; NET.code = code; NET.host = conn; NET.status = ''; NET.retry = 0; conn.send({ t: 'hello', client: CLIENT, pc, names }); onOk(); renderSync(); });
    conn.on('data', guestHandle);
    conn.on('close', () => {
      NET.host = null; render();
      if (NET.mode === 'guest' && NET.retry < 5) { NET.retry++; NET.status = `ホストとの接続が切れた。つなぎ直している…（${NET.retry}回目）`; renderSync(); setTimeout(() => reconnectGuest(), 3000); }
      else { NET.status = 'ホストとの接続が切れた（ホストのPCで部屋が開いているか確認して、参加し直す）'; renderSync(); }
    });
  });
  peer.on('error', err => {
    if (NET.mode === 'guest' && NET.retry) { NET.status = 'つなぎ直せなかった（ホストのPCを確認）'; renderSync(); return; }
    onFail(err.type === 'peer-unavailable' ? 'その部屋が見つからない。コードを確認してください' : '接続エラー：' + err.type);
  });
}
function reconnectGuest() {
  const j = NET.joinInfo; if (!j) return;
  const keepS = S, retry = NET.retry;
  joinRoom(j.code, j.pc, j.names, () => { NET.retry = 0; }, () => {});
  S = keepS; NET.retry = retry; NET.mode = 'guest'; NET.code = j.code;
}
function leaveGame() {
  if (NET.mode === 'host') sendAll({ t: 'bye' });
  if (NET.peer) { try { NET.peer.destroy(); } catch (e) {} }
  Object.assign(NET, { mode: 'local', peer: null, host: null, guests: [], code: '', status: '', members: [], present: [], setupRunning: false });
}

/* ---- ゲーム開始（ホスト） ---- */
function hostStart() {
  const members = lobbyMembers();
  const roster = [];
  members.forEach(m => m.names.forEach(n => { if (roster.length < MAXP) roster.push({ name: n, owner: m.client }); }));
  if (roster.length < 2) return;
  S = newState(roster.map(r => r.name));
  S.players.forEach((p, i) => p.owner = roster[i].owner);
  S.room = NET.code; S.title = '部屋' + NET.code; S.phase = 'setup'; S.cur = 0;
  log('メンバーがそろった。各自のPCで、創業者タイプと何で起業するかを順番に選ぶ。');
  $('overlay').hidden = true;
  render(); pushNow(); saveHostRoom();
  runSetupIfMine();
}
/* ---- 最初の準備：自分のプレイヤーの分だけ、自分のPCで選ぶ ---- */
async function runSetupIfMine() {
  if (!S || S.phase !== 'setup' || S.busy || NET.setupRunning) return;
  if (!mySeat(S.cur)) return;
  NET.setupRunning = true;
  const p = S.players[S.cur];
  S.busy = true; S.actor = CLIENT; S.actorName = p.name; render(); pushSoon(true);
  try { await initialPickFor(p); }
  finally {
    S.busy = false; S.actor = null; S.view = null;
    if (S.cur < S.players.length - 1) S.cur++;
    else { S.phase = 'play'; S.cur = 0; log('全員の準備ができた。ゲーム開始！ 左上のSTARTから時計回りに進み、中央のGOAL（企業価値100億円）をめざす。'); }
    render(); pushNow();
    NET.setupRunning = false;
  }
  runSetupIfMine();
}
function claimSeat(i) {
  if (!S || !S.players[i] || S.busy) return;
  S.players[i].owner = CLIENT;
  log(`${esc(S.players[i].name)}の担当を、このPCが引き継いだ。`);
  pushSoon(true); render(); runSetupIfMine();
}

/* ---- 右上の表示 ---- */
function renderSync() {
  const bar = $('syncbar'); if (!bar) return;
  if (!online()) { bar.className = 'g-sync local'; bar.innerHTML = 'このPCだけで遊ぶモード'; return; }
  const parts = [];
  const nOpen = NET.guests.filter(g => g.open).length;
  parts.push(NET.mode === 'host' ? `部屋コード <b class="g-code">${NET.code}</b>（ホスト・ほかのPC ${nOpen}台）` : `部屋 <b class="g-code">${NET.code}</b> に参加中`);
  if (S) {
    const mine = S.players.filter(q => q.owner === CLIENT).map(q => q.name);
    parts.push(`このPCの担当：${mine.length ? esc(mine.join('、')) : '観戦のみ'}`);
    const orphan = S.players.map((q, i) => [q, i]).filter(([q]) => q.owner && q.owner !== CLIENT && NET.present.length && !NET.present.includes(q.owner) && !q.done);
    if (orphan.length) parts.push('接続が切れたプレイヤー：' + orphan.map(([q, i]) => `${esc(q.name)} <button type="button" class="g-link" data-claim="${i}">このPCで引き継ぐ</button>`).join('　'));
  }
  if (NET.status) parts.push(esc(NET.status));
  if (S && S.phase === 'setup') {
    const p = S.players[S.cur];
    parts.push(mySeat(S.cur) ? `<b>${esc(p.name)}</b>の準備をこのPCで選んでいる` : `<b>${esc(p.name)}</b>が自分のPCで準備中${S.view ? '：' + esc(S.view) : ''}`);
  } else if (blockedByOther()) {
    const sec = Math.round((Date.now() - (S.at || Date.now())) / 1000);
    parts.push(`いま<b>${esc(S.actorName || '')}</b>が自分のPCで操作中${S.view ? '：' + esc(S.view) : ''}`);
    if (sec > 90) parts.push('<button type="button" class="g-link" id="unlockBtn">操作が止まっている？ ロックを解除</button>');
  } else if (S && !S.busy && S.finished < S.players.length && !mySeat(S.cur)) parts.push(`いまは<b>${esc(S.players[S.cur].name)}</b>の番（担当のPCで操作）`);
  bar.className = 'g-sync on';
  bar.innerHTML = parts.join('<br>');
  const u = $('unlockBtn');
  if (u) u.addEventListener('click', () => { S.busy = false; S.actor = null; S.view = null; log('ロックを解除した（止まっていた手番は途中で終了）'); pushSoon(true); });
  bar.querySelectorAll('[data-claim]').forEach(b => b.addEventListener('click', () => claimSeat(+b.dataset.claim)));
}
setInterval(() => { if (blockedByOther()) renderSync(); }, 15000);
async function initNet() { renderSync(); }

/* ===================== 保有カード（盤面の下） ===================== */

    const h = (q.accs || [])[+id]; if (!h) return '';
    const a = ACC.find(a => a.no === h.no) || {};
    return head('アクシデント', esc(h.text)) + `<p class="eff">${esc(h.result)}</p><p>効果：${esc(a.eff || '')}</p><div class="g-point"><b>IPOのポイント</b>${a.sup ? `こうしたトラブルは、${esc(a.sup)}に早めに相談しておけば防げる。` : ''}${FCOV[a.no] ? `${esc(FCOV[a.no])}の創業者なら、自分の経験で防げる。` : ''}${!a.sup && !FCOV[a.no] ? '打ち消せない重大な問題。日ごろの管理体制とチェックが大事。' : ''}</div><p style="font-size:13px">${esc(STAGE_OF(h.pos || '1'))}・マス${esc(h.pos || '')}で発生</p>`;
  }
  return '';
}
function showPanel(html) {
  const box = $('sqinfo');
  box.innerHTML = `<button type="button" class="sqi-x" aria-label="閉じる">×</button>` + html;
  box.hidden = false;
  box.querySelector('.sqi-x').addEventListener('click', () => { box.hidden = true; });
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('#holdings .h-item');
  if (b) { const h = holdingDetail(b.dataset.kind, +b.dataset.p, b.dataset.id); if (h) showPanel(h); }
});

/* ===================== マスの解説（クリック） ===================== */
function squareInfoHtml(no) {
  const sq = SQ[no]; if (!sq) return '';
  const st = no === 'GOAL' ? 'GOAL' : STAGE_OF(no);
  const parts = [`<div class="kicker">${st}${no === 'GOAL' ? '' : '・マス' + no}｜${esc(sq.kind || '')}</div><h2>${esc(sq.name)}</h2>`];
  parts.push(`<p class="eff">効果：${esc(EFF[no] || '')}</p>`);
  if (STORY[no]) parts.push(`<p>${esc(STORY[no][0])}</p><div class="g-point"><b>IPOのポイント</b>${esc(STORY[no][1])}</div>`);
  if (sq.t === 'acc') {
    const cards = ACC.filter(a => a.deck === sq.deck);
    parts.push(`<p style="font-size:13px"><b>${sq.deck}の山（${cards.length}枚）</b>：${cards.map(a => esc(a.text)).join('／')}</p>`);
  }
  if (sq.t === 'stop' && INVEST[sq.menu]) {
    parts.push(`<p style="font-size:13px"><b>投資メニュー</b></p><div class="g-money">${INVEST[sq.menu].map(o => `<span>${o[1]}｜${esc(o[0])}${o[4] ? `（条件：${esc(o[4])}）` : ''}</span><b>${yen(o[2])}${o[1] === 'ピボット' || o[1] === 'プロダクト' ? '' : `・+${o[3]}倍`}</b>`).join('')}</div>`);
  }
  if ((sq.t === 'fixed') && SUP[sq.sup]) parts.push(`<div class="g-point"><b>${esc(sq.sup)}とは</b>${esc(SUP_INFO[sq.sup] || '')}　${feeText(S && S.players[S.cur] ? S.players[S.cur] : { type: null }, sq.sup)}</div>`);
  if (no === 'GOAL') parts.push('<div class="g-point"><b>実際の基準は？</b>このゲームの目標は「企業価値100億円」。実際に東証のプライム市場へ移るには、時価総額250億円以上、流通株式時価総額100億円以上などの基準がある。</div>');
  if (sq.t === 'svco') parts.push(`<div class="g-point"><b>SVCOとは</b>${esc(SUP_INFO.SVCO)}　報酬${yen(SUP.SVCO.fee)}・企業価値×${RULES.SVCO_MULT}</div>`);
  if (sq.t === 'fund' && FUNDING[no]) parts.push(`<p style="font-size:13px">止まらなくても、通過したときにサイコロを振って出目×${yen(FUNDING[no][1])}を調達する。</p>`);
  if (sq.t === 'choice') parts.push(`<div class="g-money">${sq.opts.map(o => `<span>${esc(o.label)}</span><b style="font-weight:500">${esc(o.note)}</b>`).join('')}</div>`);
  const here = S ? S.players.filter(q => q.pos === no).map(q => esc(q.name)) : [];
  if (here.length) parts.push(`<p style="font-size:13px">いまこのマスにいる：${here.join('、')}</p>`);
  return parts.join('');
}
function showSquareInfo(no) {
  const box = $('sqinfo');
  box.innerHTML = `<button type="button" class="sqi-x" aria-label="閉じる">×</button>` + squareInfoHtml(no);
  box.hidden = false;
  box.querySelector('.sqi-x').addEventListener('click', () => { box.hidden = true; });
}
document.addEventListener('click', e => {
  const g = e.target.closest && e.target.closest('#board .sq');
  if (g) { showSquareInfo(g.dataset.sq); return; }
  if (!e.target.closest('#sqinfo')) $('sqinfo').hidden = true;
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('sq')) { e.preventDefault(); showSquareInfo(e.target.dataset.sq); }
  if (e.key === 'Escape') $('sqinfo').hidden = true;
});

document.querySelectorAll('.g-move button').forEach(b => b.addEventListener('click', () => takeTurn(+b.dataset.n || 0)));
$('undoTurnBtn').addEventListener('click', () => undoLastTurn());
$('endBtn').addEventListener('click', async () => {
  if (!S) return;
  const ok = await modal('<div class="kicker">確認</div><h2>いまの時点で集計する？</h2><p>今の時点の企業価値で順位を見る（ゲームは続けられる）。</p>', [{ label: '集計する', value: true }, { label: '続ける', value: false }]);
  if (ok) showResults();
});
$('newBtn').addEventListener('click', async () => {
  const ok = await modal(`<div class="kicker">確認</div><h2>最初の画面に戻る？</h2><p>${NET.mode === 'host' ? '部屋が閉じて、参加しているPCとのつながりも切れる。' : online() ? '部屋から抜ける。' : 'このPCだけのゲームは、進み具合が消える。'}</p>`, [{ label: '最初の画面へ', value: true }, { label: 'キャンセル', value: false }]);
  if (ok) { leaveGame(); setup(); }
});
window.addEventListener('resize', fitBoard);
new ResizeObserver(fitBoard).observe($('boardwrap'));
fitBoard();
const saved = load();
if (saved) { S = saved; S.busy = false; S.actor = null; render(); } else setup();
initNet();
window.addEventListener('beforeunload', () => { if (NET.mode === 'host') sendAll({ t: 'bye' }); });

</script>
</body>
</html>
